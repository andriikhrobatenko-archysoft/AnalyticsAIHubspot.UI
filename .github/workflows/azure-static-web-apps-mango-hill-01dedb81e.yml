name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Oryx (the build step Azure/static-web-apps-deploy runs by default) only ships Node up to
      # 22.22.0, but @angular/cli@22 refuses to even start below 22.22.3/24.15.0/26.0.0 — a hard
      # runtime check, not just an engines warning. Oryx has no version that satisfies it, so the
      # app has to be built here instead, with a real Node install, and handed to the deploy step
      # already built (skip_app_build below).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install dependencies
        working-directory: ./analytics-ai-client
        run: npm ci

      - name: Build
        working-directory: ./analytics-ai-client
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_HILL_01DEDB81E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, the action ignores output_location entirely and looks for
          # index.html directly under app_location — so app_location has to point straight at
          # the already-built folder here, not the project source root.
          app_location: "./analytics-ai-client/dist/analytics-ai-client/browser" # Pre-built output (see Build step above)
          api_location: "" # Api source code path - optional
          skip_app_build: true # Already built above — Oryx can't run this Angular version at all
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_HILL_01DEDB81E }}
          action: "close"
