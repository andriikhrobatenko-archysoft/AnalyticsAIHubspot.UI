<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">AnalyticsAI</h1>
    <p class="login__subtitle">Sign in to continue</p>

    <label class="login__field">
      <span>Username</span>
      <input type="text" formControlName="username" autocomplete="username" autofocus />
    </label>

    <label class="login__field">
      <span>Password</span>
      <app-password-input formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage()) {
      <p class="login__error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="login__submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
